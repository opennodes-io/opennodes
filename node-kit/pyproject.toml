[project]
name = "onp-node"
version = "0.1.0"
description = "OpenNodes Node Kit: turn a vLLM/Ollama/TGI deployment into a conforming ONP Node"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=42"]

[project.scripts]
onp-node = "onp_node.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onp_node*"]
