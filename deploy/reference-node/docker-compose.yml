# A standalone OpenNodes reference node on its own server: Ollama + the Node Kit + Caddy (TLS).
# Settings come from .env (see .env.example); run ./setup.sh once, then `docker compose up -d`.
services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Several small models on a 4 GB host: keep one in memory at a time (a switch costs a
      # few seconds of loading), and cap the container so a spike can't freeze the machine.
      OLLAMA_MAX_LOADED_MODELS: "1"
    mem_limit: 3g
    memswap_limit: 3g
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # One-shot: make sure the served models (space-separated MODEL) are present before the node
  # describes them. The kit offers every model Ollama lists.
  model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; for m in $$MODEL; do ollama pull \"$$m\" || exit 1; done"]
    env_file: .env
    depends_on:
      - ollama
    restart: "no"

  node:
    build: ./node
    env_file: .env
    environment:
      ENGINE_URL: http://ollama:11434/v1
      PUBLIC_URL: https://${NODE_HOST}
    volumes:
      - ./node/data:/data
    depends_on:
      model:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional second measuring point for the registry's server-location checks
  # (`docker compose --profile probe up -d`; set PROBE_* in .env).
  probe:
    image: node:24-alpine
    profiles: ["probe"]
    command: ["node", "/app/agent.mjs"]
    environment:
      PROBE_TOKEN: ${PROBE_TOKEN:-}
      PROBE_SITE: ${PROBE_SITE:-}
      PROBE_LAT: ${PROBE_LAT:-}
      PROBE_LON: ${PROBE_LON:-}
    volumes:
      - ./probe-agent:/app:ro
    mem_limit: 128m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node
    restart: unless-stopped

volumes:
  ollama:
  caddy_data:
  caddy_config:
