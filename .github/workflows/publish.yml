name: Publish packages

# Token-free releases via trusted publishing (OIDC): npm for @opennodes/* and PyPI for onp-node.
# One-time setup on the registries (see deploy/RELEASING.md): add this workflow as a trusted
# publisher for each package/project. Then: bump versions, push a tag `v*` (or run manually).
# Packages whose version already exists on the registry are skipped, so partial releases are safe.
#
# npm and PyPI are published in separate runs, never together: a tag push (or "Run workflow" with
# target npm) publishes the npm packages only; onp-node goes to PyPI last, after the registry deploy,
# with "Run workflow" and target pypi. Both jobs stay in this file because the trusted publishers on
# npm and PyPI name it (publish.yml).
#
# Everything this workflow runs is pinned: actions by commit SHA (the tag is in the comment), npm and
# the Python build tool by exact version, dependencies from impl/package-lock.json (npm ci).
# deploy/pin-versions.mjs --check (run by npm test) refuses a step that is not.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'npm: the @opennodes packages. pypi: onp-node, only after the npm release and the registry deploy.'
        type: choice
        options: [npm, pypi]
        default: npm

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: github.event_name == 'push' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. 12.2.3 is the version the 19 Nov 2026 release ran with.
      - name: npm with trusted-publishing support
        run: npm install -g npm@12.2.3 && npm --version
      - run: npm ci
        working-directory: impl
      - run: npm test
        working-directory: impl
      - name: Publish changed packages (dependency order)
        working-directory: impl
        run: |
          set -e
          for p in core cli registry ollama-router; do
            name=$(node -p "require('./packages/$p/package.json').name")
            ver=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already published)"
            else
              echo "publish $name@$ver"
              (cd "packages/$p" && npm publish --access public --provenance)
            fi
          done

  pypi:
    # never on a tag push: only "Run workflow" with target pypi
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build onp-node
        working-directory: node-kit
        run: |
          python -m pip install -q build==1.6.1
          python -m build
      - name: Skip if this version is already on PyPI
        id: check
        working-directory: node-kit
        run: |
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -fs "https://pypi.org/pypi/onp-node/$ver/json" >/dev/null; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "onp-node $ver already on PyPI"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: node-kit/dist
