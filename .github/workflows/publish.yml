name: Publish packages

# Token-free releases via trusted publishing (OIDC): npm for @opennodes/* and PyPI for onp-node.
# One-time setup on the registries (see deploy/RELEASING.md): add this workflow as a trusted
# publisher for each package/project. Then: bump versions, push a tag `v*` (or run manually).
# Packages whose version already exists on the registry are skipped, so partial releases are safe.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted-publishing support (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: npm install
        working-directory: impl
      - run: npm test
        working-directory: impl
      - name: Publish changed packages (dependency order)
        working-directory: impl
        run: |
          set -e
          for p in core cli registry ollama-router; do
            name=$(node -p "require('./packages/$p/package.json').name")
            ver=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already published)"
            else
              echo "publish $name@$ver"
              (cd "packages/$p" && npm publish --access public --provenance)
            fi
          done

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build onp-node
        working-directory: node-kit
        run: |
          python -m pip install -q build
          python -m build
      - name: Skip if this version is already on PyPI
        id: check
        working-directory: node-kit
        run: |
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -fs "https://pypi.org/pypi/onp-node/$ver/json" >/dev/null; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "onp-node $ver already on PyPI"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: node-kit/dist
